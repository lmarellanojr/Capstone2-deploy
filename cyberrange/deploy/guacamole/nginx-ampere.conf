# Path B origin: guacamole eth1 only. After apt install nginx, systemctl
# restart (not reload) so listen 10.115.77.12:80 is not blocked by inherited
# 0.0.0.0:80 sockets from the package default site.
upstream keycloak {
    server 127.0.0.1:8083;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare origin is HTTP; students are HTTPS. Pass CF's proto through so
# Keycloak's iss claim and NextAuth's cookies match the public https:// host.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 10.115.77.12:80;
    server_name _;

    location /auth/ {
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ssh-websocket {
        proxy_pass http://10.115.77.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Keycloak admin console v2 emits /resources/... without the /auth prefix.
    # Without this, those requests hit the portal and the admin UI never finishes loading.
    location /resources/ {
        proxy_pass http://keycloak/auth/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Admin SPA authServerUrl omits /auth, so it calls /admin/serverinfo and
    # /admin/realms/... /admin/master/... . Do NOT match portal /admin/pods or /admin/users.
    location ~ ^/admin/(serverinfo|realms|master)(/|$) {
        rewrite ^/admin/(.*)$ /auth/admin/$1 break;
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Admin SPA may call /realms/master/... without /auth. Limit to master only so
    # student cyber-range is not exposed on a second public IdP prefix (/realms/cyber-range).
    location ~ ^/realms/master(/|$) {
        rewrite ^/realms/(.*)$ /auth/realms/$1 break;
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://10.115.77.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
