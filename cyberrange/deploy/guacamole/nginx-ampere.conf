# Path B origin: guacamole eth1 only. After apt install nginx, systemctl
# restart (not reload) so listen 10.115.77.12:80 is not blocked by inherited
# 0.0.0.0:80 sockets from the package default site.
upstream keycloak {
    server 127.0.0.1:8083;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare origin is HTTP; students are HTTPS. Pass CF's proto through so
# Keycloak's iss claim and NextAuth's cookies match the public https:// host.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 10.115.77.12:80;
    server_name _;

    # After repeated logins in one browser, accumulated Keycloak/NextAuth
    # cookies push request headers past nginx's default 8k buffer and it
    # returns 400 "Request Header Or Cookie Too Large" (REG-01 #39 Defect 4).
    # Raise the client header buffers so a full cookie jar still fits.
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    location /auth/ {
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ssh-websocket {
        proxy_pass http://10.115.77.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Keycloak admin console v2 emits /resources/... without the /auth prefix.
    # Without this, those requests hit the portal and the admin UI never finishes loading.
    location /resources/ {
        proxy_pass http://keycloak/auth/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Admin SPA authServerUrl omits /auth, so it calls /admin/serverinfo and
    # /admin/realms/... /admin/master/... . Do NOT match portal /admin/pods or /admin/users.
    location ~ ^/admin/(serverinfo|realms|master)(/|$) {
        rewrite ^/admin/(.*)$ /auth/admin/$1 break;
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Admin SPA may call /realms/master/... without /auth. Limit to master only so
    # student cyber-range is not exposed on a second public IdP prefix (/realms/cyber-range).
    location ~ ^/realms/master(/|$) {
        rewrite ^/realms/(.*)$ /auth/realms/$1 break;
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://10.115.77.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # NextAuth's encrypted JWT session cookie carries the Keycloak
        # access+refresh+id tokens plus (as of the admin-dashboard branch)
        # a realm_access.roles array, and the OAuth callback URL itself is
        # long. Together these exceed nginx's default 4k/8k proxy buffers,
        # which surfaces as "upstream sent too big header" -> Cloudflare 502
        # on /api/auth/callback/keycloak. Sized generously above the
        # observed failure, not tightly to it.
        # (Was live on the Ampere origin but missing from this file.)
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # Evidence screenshot uploads: the backend accepts up to 5 MB per image.
        # nginx defaults to 1 MB and would answer 413 before the portal sees it.
        client_max_body_size 6m;
    }
}
