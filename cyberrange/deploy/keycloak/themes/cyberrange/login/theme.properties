# SEC-03 UI: MMDC Cyber Range login theme.
# Extends Keycloak's built-in "keycloak" login theme (the one the realm used
# before), so every page and form keeps working; this theme only replaces the
# page frame (template.ftl), the two MFA pages and the styling.
parent=keycloak
import=common/keycloak
# login.css is resolved from the parent theme; cyberrange.css overrides it.
styles=css/login.css css/cyberrange.css
