# cyberrange-portal.service.d/memory.conf
#
# Inner memory ceiling for the Next.js portal, checked in as a drop-in rather
# than applied at runtime with `systemctl set-property` -- a runtime property is
# invisible in git, survives nowhere, and silently disappears on a container
# recreate.
#
# The portal runs as a systemd USER unit on the Ampere host -- not inside the
# guacamole container. (An earlier revision of this comment said otherwise; the
# container hosts nginx and Keycloak only. Evidence: 2026-08-29-ampere-task10.md.)
#
# Install on the host as llms_admin:
#   mkdir -p ~/.config/systemd/user/cyberrange-portal.service.d
#   cp memory.conf ~/.config/systemd/user/cyberrange-portal.service.d/memory.conf
#   systemctl --user daemon-reload
#   systemctl --user restart cyberrange-portal.service
# Verify:
#   systemctl --user show -p MemoryMax cyberrange-portal.service
#   # expect MemoryMax=536870912
#
# 512 MiB: production `npm start` serves precompiled output in roughly
# 250-300 MB, so this is generous for serve-only. PROVISIONAL pending the live
# baseline measurement.
#
# IMPORTANT -- this does NOT cover `npm run build`. A build launched via
# `lxc exec` is a separate process outside this unit's cgroup, so this ceiling
# gives it no bound whatsoever. That is precisely why the 12 GiB target builds
# off-host (Manual Chapter 04 Step 5) instead of relying on a limit that cannot apply.
[Service]
MemoryMax=512M
